<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rules of Villainy — Player Report</title>
<style>
:root{
  --bg:#181025; --panel:#241a38; --panel2:#2e2148; --line:#43305f;
  --text:#f4eefc; --sub:#b3a0cf; --accent:#a855d8; --accent2:#2dd9b9;
  --win:#3ecf8e; --loss:#ef4d6b; --draw:#e0a83e; --gold:#c98a3e;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f6f1fb; --panel:#ffffff; --panel2:#f0e8fa; --line:#ddd0ee;
    --text:#241537; --sub:#6b5686; --accent:#8b2fc9; --accent2:#0f9e88;
    --win:#1f9d63; --loss:#c9384f; --draw:#a9740c; --gold:#a9691f;
  }
}
:root[data-theme="dark"]{
  --bg:#181025; --panel:#241a38; --panel2:#2e2148; --line:#43305f;
  --text:#f4eefc; --sub:#b3a0cf; --accent:#a855d8; --accent2:#2dd9b9;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  padding:20px 16px 12px;max-width:1100px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
}
header .logo{
  width:56px;height:56px;border-radius:14px;flex:0 0 auto;
  background:var(--panel2);border:1px solid var(--gold);object-fit:cover;
}
header .headtext{min-width:0}
h1{
  font-size:1.4rem;margin:0 0 4px;font-weight:800;letter-spacing:-0.02em;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header p{margin:0;color:var(--sub);font-size:0.85rem}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.tabs{
  display:flex;gap:6px;overflow-x:auto;padding:10px 0 16px;
  -webkit-overflow-scrolling:touch;
}

.tabs::-webkit-scrollbar{height:4px}
.tab{
  flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
  color:var(--sub);padding:8px 14px;border-radius:20px;font-size:0.82rem;
  cursor:pointer;white-space:nowrap;transition:all .15s;font-weight:600;
}
.tab:hover{border-color:var(--accent2)}
.tab.active{background:linear-gradient(90deg,var(--accent),#7a3ac9);color:#fff;border-color:var(--gold)}
.tab-divider{
  flex:0 0 auto;display:flex;align-items:center;color:var(--sub);
  font-size:0.68rem;text-transform:uppercase;letter-spacing:.08em;
  padding:0 8px;font-weight:700;border-left:1px solid var(--line);margin-left:4px;
}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:16px;
}
.hype{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#2e1548,#3a1d5c 45%,#1c3a44);
  border:1px solid var(--gold);
}
.hype::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 85% -10%,rgba(45,217,185,.25),transparent 55%),
             radial-gradient(circle at -10% 110%,rgba(168,85,216,.3),transparent 55%);
  pointer-events:none;
}
.hype-head{position:relative;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hype-head h2{
  margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-0.01em;
  background:linear-gradient(90deg,#fff,var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hype-head span{color:var(--sub);font-size:0.8rem}
.hype-grid{
  position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}
.hype-stat{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:12px 14px;backdrop-filter:blur(2px);
}
.hype-stat .label{font-size:0.66rem;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.hype-stat .val{font-size:1.5rem;font-weight:800;color:#fff;line-height:1.1}
.hype-stat .sub{font-size:0.7rem;color:var(--accent2);margin-top:2px;font-weight:600}
.hype-tag{
  position:relative;margin-top:12px;font-size:0.82rem;color:#e9dcff;
  font-style:italic;
}
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:10px;margin-bottom:16px;
}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;
}
.stat .label{font-size:0.68rem;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.stat .val{font-size:1.35rem;font-weight:700}
.playerhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.playerhead h2{margin:0;font-size:1.15rem}
.badge{
  font-size:0.7rem;color:var(--sub);background:var(--panel2);
  padding:3px 9px;border-radius:8px;border:1px solid var(--line);
}
.chart-wrap{overflow-x:auto;margin-bottom:4px}
svg text{fill:var(--sub);font-size:10px}
.tourn{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tourn-head{
  background:var(--panel2);padding:12px 16px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.tourn-head h3{margin:0;font-size:0.92rem;font-weight:600}
.tourn-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:0.75rem;color:var(--sub)}
.chev{transition:transform .2s;color:var(--sub);font-size:0.8rem}
.tourn.open .chev{transform:rotate(90deg)}
.tourn-body{display:none;padding:0}
.tourn.open .tourn-body{display:block}
table{width:100%;border-collapse:collapse;font-size:0.82rem}
th{
  text-align:left;padding:8px 12px;color:var(--sub);font-weight:600;
  font-size:0.7rem;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--line);
}
td{padding:8px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
.pill{
  display:inline-block;padding:2px 9px;border-radius:20px;font-weight:700;
  font-size:0.72rem;
}
.pill.Win{background:rgba(62,207,142,.15);color:var(--win)}
.pill.Loss{background:rgba(242,84,91,.15);color:var(--loss)}
.pill.Draw{background:rgba(232,179,57,.15);color:var(--draw)}
.pill.Bye{background:var(--panel2);color:var(--sub)}
.delta.pos{color:var(--win)}
.delta.neg{color:var(--loss)}
.tablewrap{overflow-x:auto}
.overview-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.overview-table th{cursor:pointer;user-select:none}
.overview-table th:hover{color:var(--text)}
.overview-table td,.overview-table th{padding:9px 10px}
.overview-table tbody tr{cursor:pointer;transition:background .1s}
.overview-table tbody tr:hover{background:var(--panel2)}
footer{text-align:center;color:var(--sub);font-size:0.72rem;padding:20px 0}
</style>
</head>

const allPlayers = players.concat(management);
function findPlayer(id){ return allPlayers.find(x=>x.id===id); }

let activeId = players[0].id;
let sortState = {k:'elo', dir:-1};

function fmtPct(n){return n.toFixed(1)+'%';}

function bestWinStreak(p){
  let rounds = [];
  [...p.tournaments].reverse().forEach(t=>{
    t.rounds.forEach(r=> rounds.push(r[3]));
  });
  let best=0, cur=0;
  rounds.forEach(result=>{
    if(result==='Win'){ cur++; if(cur>best) best=cur; }
    else if(result==='Bye'){ /* doesn't break streak */ }
    else { cur=0; }
  });
  return best;
}

function topTakedown(p){
  let best=null;
  p.tournaments.forEach(t=>{
    t.rounds.forEach(r=>{
      if(r[3]==='Win' && r[2]!=null){
        if(!best || r[2]>best.elo) best={name:r[1], elo:r[2]};
      }
    });
  });
  return best;
}

function renderOverview(){
  const body = document.getElementById('overviewBody');
  let rows = allPlayers.map(p=>({p, events:p.tournaments.length}));
  rows.sort((a,b)=>{
    const k = sortState.k;
    let av = k==='name'?a.p.name:k==='record'?a.p.record:k==='events'?a.events:a.p[k];
    let bv = k==='name'?b.p.name:k==='record'?b.p.record:k==='events'?b.events:b.p[k];
    if(typeof av==='string') return sortState.dir*av.localeCompare(bv);
    return sortState.dir*(av-bv);
  });
  body.innerHTML = rows.map(({p,events})=>{
    const td = topTakedown(p);
    const streak = bestWinStreak(p);
    return `
    <tr onclick="selectPlayer('${p.id}')">
      <td><strong>${p.name}</strong>${p.group==='management'?' <span class="badge">Mgmt</span>':''}</td>
      <td>${p.elo}</td>
      <td>#${p.rank.toLocaleString()}</td>
      <td>${p.record}</td>
      <td>${fmtPct(p.gw)}</td>
      <td>${events}</td>
      <td>${td?`${td.name} <span style="color:var(--sub)">(${td.elo})</span>`:'—'}</td>
      <td>${streak}${streak>=5?' 🔥':''}</td>
    </tr>`;}).join('');
}

document.querySelectorAll.length; // noop
document.getElementById('overviewTable').querySelector('thead').addEventListener('click', e=>{
  const th = e.target.closest('th');
  if(!th) return;
  const k = th.dataset.k;
  sortState.dir = (sortState.k===k) ? -sortState.dir : -1;
  sortState.k = k;
  renderOverview();
});

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const rosterTabs = players.map(p=>`<button class="tab${p.id===activeId?' active':''}" onclick="selectPlayer('${p.id}')">${p.name}</button>`).join('');
  const mgmtTabs = management.map(p=>`<button class="tab${p.id===activeId?' active':''}" onclick="selectPlayer('${p.id}')">${p.name}</button>`).join('');
  tabs.innerHTML = rosterTabs
    + `<span class="tab-divider">Management</span>`
    + mgmtTabs;
}

function eloColor(v){ return v>0? 'var(--win)': v<0? 'var(--loss)':'var(--sub)'; }

function buildChart(points){
  // points: array of {label, elo}
  const w = Math.max(560, points.length*46);
  const h = 150;
  const padL=40, padR=10, padT=14, padB=22;
  const elos = points.map(p=>p.elo);
  const min = Math.min(...elos)-15, max = Math.max(...elos)+15;
  const x = i => padL + (i/(points.length-1||1))*(w-padL-padR);
  const y = v => padT + (1-(v-min)/(max-min))*(h-padT-padB);
  let path = points.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.elo).toFixed(1)}`).join(' ');
  let dots = points.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.elo).toFixed(1)}" r="3" fill="${p.result==='Win'?'#3ecf8e':p.result==='Loss'?'#f2545b':p.result==='Draw'?'#e8b339':'#9aa3c7'}"><title>${p.label}: ${p.elo}</title></circle>`).join('');
  const gridY = [min, (min+max)/2, max];
  let grid = gridY.map(v=>`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${w-padR}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="4" y="${(y(v)+3).toFixed(1)}">${Math.round(v)}</text>`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${grid}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function renderPlayer(){
  const p = findPlayer(activeId);
  const content = document.getElementById('content');

  // tournaments are listed newest-first on the site; reverse to build a
  // chronological (oldest -> newest) elo trajectory
  let points = [];
  [...p.tournaments].reverse().forEach(t=>{
    t.rounds.forEach(r=>{
      if(r[5]!=null) points.push({label:`${t.name} ${r[0]}`, elo:r[5], result:r[3]});
    });
  });

  const winCount = p.tournaments.reduce((s,t)=>s+t.rounds.filter(r=>r[3]==='Win').length,0);
  const lossCount = p.tournaments.reduce((s,t)=>s+t.rounds.filter(r=>r[3]==='Loss').length,0);
  const drawCount = p.tournaments.reduce((s,t)=>s+t.rounds.filter(r=>r[3]==='Draw').length,0);

  content.innerHTML = `
    <div class="card">
      <div class="playerhead">
        <h2><a href="${p.url}" target="_blank" rel="noopener">${p.name}</a></h2>
        <span class="badge">${p.tournaments.length} tournaments</span>
      </div>
      <div class="stats-grid">
        <div class="stat"><div class="label">Elo</div><div class="val">${p.elo}</div></div>
        <div class="stat"><div class="label">Rank</div><div class="val">#${p.rank.toLocaleString()}</div></div>
        <div class="stat"><div class="label">Record</div><div class="val">${p.record}</div></div>
        <div class="stat"><div class="label">Game Win %</div><div class="val">${fmtPct(p.gw)}</div></div>
        <div class="stat"><div class="label">Matches W-L-D</div><div class="val">${winCount}-${lossCount}-${drawCount}</div></div>
      </div>
      <div class="label" style="font-size:0.7rem;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Elo trajectory across all events</div>
      <div class="chart-wrap">${buildChart(points)}</div>
    </div>
    ${p.tournaments.map((t,i)=>`
      <div class="tourn${i===0?' open':''}" id="t-${p.id}-${i}">
        <div class="tourn-head" onclick="toggleTourn('${p.id}',${i})">
          <div>
            <h3><a href="${t.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t.name}</a></h3>
            <div class="tourn-meta">
              <span>Placement #${t.place}</span>
              <span>Record ${t.record}</span>
              <span>GW ${fmtPct(t.gw)}</span>
              <span>Elo ${t.elo} (<span class="delta ${t.eloDelta>=0?'pos':'neg'}">${t.eloDelta>=0?'+':''}${t.eloDelta}</span>)</span>
            </div>
          </div>
          <span class="chev">▶</span>
        </div>
        <div class="tourn-body">
          <div class="tablewrap">
            <table>
              <thead><tr><th>Round</th><th>Opponent</th><th>Result</th><th>Elo After</th><th>Δ</th></tr></thead>
              <tbody>
                ${t.rounds.map(r=>`
                  <tr>
                    <td>${r[0]}</td>
                    <td>${r[1]}${r[2]!=null?` <span style="color:var(--sub)">(${r[2]})</span>`:''}</td>
                    <td><span class="pill ${r[3]}">${r[3]}${r[4]?' '+r[4]:''}</span></td>
                    <td>${r[5]!=null?r[5]:'—'}</td>
                    <td>${r[6]!=null?`<span class="delta ${r[6]>=0?'pos':'neg'}">${r[6]>=0?'+':''}${r[6]}</span>`:'—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

function selectPlayer(id){
  activeId = id;
  renderTabs();
  renderPlayer();
  document.getElementById('content').scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleTourn(pid,i){
  document.getElementById(`t-${pid}-${i}`).classList.toggle('open');
}

function computeTeamStats(){
  let w=0,l=0,d=0,events=0,maxElo=-1,maxEloPlayer=null;
  allPlayers.forEach(p=>{
    const parts = p.record.split('-').map(Number);
    w+=parts[0]; l+=parts[1]; d+=parts[2];
    events+=p.tournaments.length;
    if(p.elo>maxElo){maxElo=p.elo;maxEloPlayer=p;}
  });
  const total = w+l+d;
  const winRate = total? (w/total*100):0;
  return {w,l,d,total,events,winRate,maxElo,maxEloPlayer,roster:allPlayers.length};
}

function renderHype(){
  const s = computeTeamStats();
  document.getElementById('hypeCard').innerHTML = `
    <div class="hype-head">
      <h2>🐲 Rules of Villainy — Squad Report</h2>
      <span>They came. They dueled. They got wrecked.</span>
    </div>
    <div class="hype-grid">
      <div class="hype-stat"><div class="label">Opponents Crushed</div><div class="val">${s.w}</div><div class="sub">total match wins</div></div>
      <div class="hype-stat"><div class="label">Matches Fought</div><div class="val">${s.total}</div><div class="sub">across all events</div></div>
      <div class="hype-stat"><div class="label">Squad Win Rate</div><div class="val">${s.winRate.toFixed(1)}%</div><div class="sub">${s.w}-${s.l}-${s.d}</div></div>
      <div class="hype-stat"><div class="label">Tournament Entries</div><div class="val">${s.events}</div><div class="sub">${s.roster} villains deployed</div></div>
      <div class="hype-stat"><div class="label">Peak Elo</div><div class="val">${s.maxElo}</div><div class="sub">${s.maxEloPlayer.name}</div></div>
    </div>
    <div class="hype-tag">Every loss was just research. Every win was inevitable.</div>
  `;
}

renderOverview();
renderTabs();
renderPlayer();
renderHype();
</script>
</body>
</html>
